<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">    
    <script src="sesion.js" defer></script>
</head>
<body>
    <header> 
        <a href="index.html">Colegio Coralia Quiroz</a>
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-boton" aria-label="Abrir menú">☰</label>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="oferta.html">Oferta Académica</a></li>
                <li><a href="matricula.html">Matrícula y Admisión</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="login.html" id="enlace-sesion" class="activo">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="pagina-login">
            <article class="tarjeta-login">
                <h1>Bienvenido</h1>
                <p>Ingresa a tu cuenta de estudiante.</p>

                <p class="nota-prueba"></p>

                <form action="#" method="post" id="form-login">
                    <div class="campo">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" name="correo" placeholder="nombre@correo.com" required>
                    </div>

                    <div class="campo">
                        <label for="clave">Contraseña</label>
                        <input type="password" id="clave" name="clave" placeholder="Mínimo 6 caracteres" minlength="6" required>
                    </div>

                    <button type="submit" class="boton">Entrar</button>
                    <a href="#" class="enlace">¿Olvidaste tu contraseña?</a>
                </form>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Colegio Coralia Quiroz. Proyecto Educativo.</p>
    </footer>
</body>
</html>
